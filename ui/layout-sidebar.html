<script>
  window.__USER__ = <?!= JSON.stringify(user || {}) ?>;
  window.__TOKEN__ = '<?!= token ?>';
  window.__PAGE__ = '<?!= pageName ?>';
  window.__MENU__ = <?!= JSON.stringify(roleMenu || []) ?>;
  window.__CONFIG__ = <?!= JSON.stringify(appConfig) ?>;
</script>

<!-- Backdrop (mobile) -->
<div id="sidebar-backdrop" class="lg:hidden fixed inset-0 bg-black/40 z-40 hidden" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<aside id="sidebar" class="fixed top-0 left-0 h-full w-[80vw] max-w-[260px] lg:w-[260px] bg-white border-r border-border z-50 flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">
  <!-- Logo -->
  <div class="h-16 px-4 flex items-center gap-3 border-b border-border">
    <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center flex-shrink-0">
      <span class="material-symbols-outlined text-white text-[22px]">school</span>
    </div>
    <div class="min-w-0">
      <div class="text-base font-bold truncate"><?= appConfig.APP_NAME ?></div>
      <div class="text-xs text-text-muted truncate"><?= appConfig.SCHOOL_NAME ?></div>
    </div>
  </div>

  <!-- Role Badge -->
  <div class="px-4 py-3 border-b border-border">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-success animate-pulse"></span>
      <span class="text-xs font-semibold text-text-muted">Peran Aktif:</span>
      <span class="ml-auto px-2 py-0.5 rounded-full text-xs font-bold bg-primary-50 text-primary" id="role-badge">
        <?= user ? user.role : '' ?>
      </span>
    </div>
  </div>

  <!-- Menu -->
  <nav class="flex-1 overflow-y-auto p-3 space-y-0.5">
    <? roleMenu.forEach(function(item) { ?>
      <!-- 👇 GUNAKAN webAppUrl DAN target="_top" 👇 -->
      <a href="<?= webAppUrl ?>?page=<?= item.page ?>&token=<?= token ?>" target="_top"
   onclick="showTopLoadingBar()" 
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors <?= item.page === pageName ? 'bg-primary-50 text-primary font-bold' : 'text-text-muted hover:bg-bg-page hover:text-text-primary font-medium' ?>">
        <span class="material-symbols-outlined text-[20px]"><?= item.icon ?></span>
        <span class="text-sm truncate"><?= item.label ?></span>
      </a>
    <? }); ?>
  </nav>

  <!-- User Profile Footer -->
  <div class="p-3 border-t border-border">
    <div class="flex items-center gap-2 p-2 rounded-lg bg-bg-page">
      <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center flex-shrink-0">
        <span class="material-symbols-outlined text-white text-[18px]">person</span>
      </div>
      <div class="min-w-0 flex-1">
        <div class="text-sm font-semibold truncate"><?= user ? user.name : 'Guest' ?></div>
        <div class="text-xs text-text-muted truncate"><?= user ? user.email : '' ?></div>
      </div>
      <button onclick="handleLogout()" class="w-8 h-8 rounded-lg flex items-center justify-center text-text-muted hover:bg-border" title="Keluar">
        <span class="material-symbols-outlined text-[18px]">logout</span>
      </button>
    </div>
  </div>
</aside>

<script>
  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const bd = document.getElementById('sidebar-backdrop');
    if (!sb) return;
    sb.classList.toggle('-translate-x-full');
    bd.classList.toggle('hidden');
  }
</script>

<style>
  #top-loading-bar {
    position: fixed; top: 0; left: 0; height: 3px; background: #2563EB; 
    width: 0%; z-index: 9999; transition: width 0.3s ease;
  }
</style>
<div id="top-loading-bar"></div>
<script>
  function showTopLoadingBar() {
    const bar = document.getElementById('top-loading-bar');
    bar.style.width = '30%';
    setTimeout(() => { bar.style.width = '70%'; }, 200);
    setTimeout(() => { bar.style.width = '90%'; }, 500);
  }
</script>
